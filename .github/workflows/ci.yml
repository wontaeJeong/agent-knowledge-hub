name: Verify
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "22"
          - os: ubuntu-latest
            node: "24"
          - os: macos-latest
            node: "24"
          - os: windows-latest
            node: "24"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Upload verified static demo (not a production release)
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-demo-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  container:
    name: Docker build and HTTP smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: knowledge-ci-${{ github.run_id }}-${{ github.run_attempt }}
      AGENT_KNOWLEDGE_HUB_HTTP_PORT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Build and wait for container health
        run: docker compose up --build --wait --wait-timeout 90
      - name: Verify container HTTP responses
        run: node scripts/smoke.mjs "http://$(docker compose port agent-knowledge-hub 8080)"
      - name: Container diagnostics
        if: always()
        run: docker compose logs --no-color
      - name: Stop this run's containers
        if: always()
        run: docker compose down

  server:
    name: PostgreSQL server regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: knowledge_test
          POSTGRES_PASSWORD: test-only-not-for-deployment
          POSTGRES_DB: knowledge_test
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U knowledge_test -d knowledge_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://knowledge_test:test-only-not-for-deployment@127.0.0.1:5432/knowledge_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:server
      - run: npm run test:server

  k8s:
    name: K8s site overlay and release guard
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify Kubernetes manifest tests
        run: |
          kubectl version --client
          node --test scripts/k8s/*.test.mjs
      - name: Build reviewed synthetic STG/PROD overlays (never apply to cluster)
        run: |
          node scripts/k8s/prepare-site.mjs deploy/fixtures/site-ci-stg.json
          node scripts/k8s/prepare-site.mjs deploy/fixtures/site-ci-prod.json
          node scripts/k8s/validate-production.mjs deploy/sites/stg
          node scripts/k8s/validate-production.mjs deploy/sites/prod
      - name: Confirm unconfigured templates fail production guard
        run: |
          if node scripts/k8s/validate-production.mjs deploy/overlays/stg; then exit 1; fi
          if node scripts/k8s/validate-production.mjs deploy/overlays/prod; then exit 1; fi

  check:
    name: check
    if: always()
    needs: [verify, container, server, k8s]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every verification job to pass
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
          SERVER_RESULT: ${{ needs.server.result }}
          K8S_RESULT: ${{ needs.k8s.result }}
        run: test "$VERIFY_RESULT" = success && test "$CONTAINER_RESULT" = success && test "$SERVER_RESULT" = success && test "$K8S_RESULT" = success
