services:
  postgres-test:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: knowledge_test
      POSTGRES_PASSWORD: test-only-not-for-deployment
      POSTGRES_DB: knowledge_test
    ports:
      - "127.0.0.1:55439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge_test -d knowledge_test"]
      interval: 2s
      timeout: 2s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
