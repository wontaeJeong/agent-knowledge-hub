apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agent-knowledge-hub-local
resources:
  - ../../base
  - namespace.yaml
  - keycloak.yaml
configMapGenerator:
  - name: knowledge-config
    literals:
      - NODE_ENV=development
      - OIDC_ALLOW_HTTP=true
      - APP_ORIGIN=http://localhost:28080
      - OIDC_ISSUER=http://localhost:28081/realms/knowledge
      - OIDC_INTERNAL_URL=http://knowledge-keycloak:8080
      - OIDC_CLIENT_ID=knowledge-hub
      - WORKSPACE_ID=default
      - OIDC_GROUP_ROLES={"reviewers":"reviewer","writers":"editor","readers":"reader"}
  - name: keycloak-realm
    files:
      - knowledge-realm.json
patches:
  - target:
      kind: Service
      name: knowledge-app
    patch: |-
      - op: add
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
