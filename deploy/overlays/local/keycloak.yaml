apiVersion: v1
kind: Service
metadata:
  name: knowledge-keycloak
spec:
  type: NodePort
  selector:
    app: knowledge-keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-keycloak
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: knowledge-keycloak
  template:
    metadata:
      labels:
        app: knowledge-keycloak
    spec:
      automountServiceAccountToken: false
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.5.2
          args: [start-dev, --import-realm]
          env:
            - name: KC_HOSTNAME
              value: http://localhost:28081
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: JAVA_OPTS_APPEND
              value: "-Xms64m -Xmx256m"
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: local-admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: knowledge-db-secret
                  key: password
          ports:
            - containerPort: 8080
            - containerPort: 9000
              name: health
          startupProbe:
            httpGet:
              path: /health/ready
              port: health
            failureThreshold: 90
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            periodSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 512Mi
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
