apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: knowledge-app
spec:
  ingressClassName: CHANGE-ME
  tls:
    - hosts: [CHANGE-ME-STG.invalid]
      secretName: knowledge-tls
  rules:
    - host: CHANGE-ME-STG.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: knowledge-app
                port:
                  number: 8080
