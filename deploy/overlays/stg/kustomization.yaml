apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agent-knowledge-hub-stg
resources:
  - ../../base
  - namespace.yaml
  - network.yaml
  - ingress.yaml
configMapGenerator:
  - name: knowledge-config
    literals:
      - NODE_ENV=production
      - APP_ORIGIN=https://CHANGE-ME-STG.invalid
      - OIDC_ISSUER=https://CHANGE-ME-IDP.invalid
      - OIDC_CLIENT_ID=CHANGE-ME-STG
      - WORKSPACE_ID=default
      - OIDC_GROUP_ROLES={"knowledge-reviewers":"reviewer","knowledge-writers":"editor","knowledge-readers":"reader"}
