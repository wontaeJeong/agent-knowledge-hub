apiVersion: v1
kind: ServiceAccount
metadata:
  name: knowledge-app
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: knowledge-app
  template:
    metadata:
      labels:
        app: knowledge-app
    spec:
      serviceAccountName: knowledge-app
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: knowledge-hub:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: knowledge-config
            - secretRef:
                name: knowledge-secrets
          env:
            - name: PORT
              value: "8080"
            - name: AKH_BLOB_ROOT
              value: /data/blobs
            - name: AKH_AUDIT_ROOT
              value: /data/audit/private
            - name: AKH_BACKUP_ROOT
              value: /data/backups
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: audit
              mountPath: /data/audit
            - name: backups
              mountPath: /data/backups
            - name: content
              mountPath: /data/blobs
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: audit
          persistentVolumeClaim:
            claimName: knowledge-audit
        - name: backups
          persistentVolumeClaim:
            claimName: knowledge-backups
        - name: content
          persistentVolumeClaim:
            claimName: knowledge-blobs
        - name: temporary
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: knowledge-app
spec:
  selector:
    app: knowledge-app
  ports:
    - name: http
      port: 8080
      targetPort: http
